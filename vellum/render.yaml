# One-click deploy on Render: New > Blueprint > pick this repo. Then paste the keys from the shared .env
# into the service's Environment tab (they are NOT in git). Single instance: cases live in memory.
services:
  - type: web
    name: vellum
    runtime: docker
    rootDir: vellum
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: PORT
        value: "8787"
