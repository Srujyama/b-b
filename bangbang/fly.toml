# Full BangBang server (API + WebSockets + web) on Fly.io. Deploy from bangbang/:  fly deploy
# ONE always-on machine: cases, escrow secrets and the live call bridge live in this process (and on /data).
app = "bangbang-bab"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8787"
  DATA_DIR = "/data"
  PUBLIC_WS_ORIGIN = "wss://bangbang-bab.fly.dev"
  PUBLIC_URL = "https://bangbang-bab.fly.dev"

[mounts]
  source = "bangbang_data"
  destination = "/data"

[http_service]
  internal_port = 8787
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/health"
    timeout = "5s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
