name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bangbang/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bangbang/server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  # Blocks a stream A/B/C PR that edits another stream's files (see .github/ownership.json).
  ownership:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'cross-stream-ok')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          node .github/scripts/check-ownership.mjs "${{ github.head_ref }}" $files
