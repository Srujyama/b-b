name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bangbang/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: bangbang/server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run
