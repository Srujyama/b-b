name: ci
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: vellum/server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: vellum/server/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  # Blocks a stream A/B/C PR that edits another stream's files (see .github/ownership.json).
  ownership:
    if: github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'cross-stream-ok')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          files=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          node .github/scripts/check-ownership.mjs "${{ github.head_ref }}" $files

  # Deploy the backend after tests pass on main. The token is scoped to the vellum-app Fly app only.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: server
    runs-on: ubuntu-latest
    concurrency: deploy-fly
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        working-directory: vellum
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - run: curl -fsS https://vellum-app.fly.dev/health
